services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: odoo
      PGPASSWORD: ${POSTGRES_PASSWORD:-odoo}
    ports:
      # Local only: the database manager is reachable until admin_passwd is set.
      # Keep both ports equal: wkhtmltopdf runs in the container and fetches CSS
      # from web.base.url, so another host port silently breaks PDF styling.
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./custom_addons:/opt/odoo/custom_addons

volumes:
  db-data:
  odoo-data:
