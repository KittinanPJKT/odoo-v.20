[options]
; Test B / Demo / UAT (ใช้ Demo ก่อนรันระบบจริง - ตั้งค่าจำลองเหมือน Production)
addons_path = /opt/odoo/odoo/addons,/opt/odoo/addons,/opt/odoo/custom_addons
data_dir = /var/lib/odoo

; HTTP & Reverse Proxy
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
proxy_mode = True

; Database & Security
; Inject real secret via ODOO_ADMIN_PASSWD in deploy/env/test-b.env
admin_passwd =
list_db = False
dbfilter = ^odoo_test_b$
db_maxconn = 32
without_demo = True

; Multiprocessing (Simulates Production worker/gevent behavior with lighter footprint)
workers = 2
gevent_workers = 1
max_cron_threads = 1
limit_memory_soft = 1073741824
limit_memory_hard = 1610612736
limit_time_cpu = 600
limit_time_real = 1200

; Safe Outbound Email Fallback (captures test emails into Mailpit container)
smtp_server = mailpit
smtp_port = 1025
smtp_ssl = False

; Logging
log_level = info
log_handler = :INFO,werkzeug:WARNING

