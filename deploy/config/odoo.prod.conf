[options]
; Production (ตัวจริง - สำหรับลูกค้าใช้งานจริง)
addons_path = /opt/odoo/odoo/addons,/opt/odoo/addons,/opt/odoo/custom_addons
data_dir = /var/lib/odoo

; HTTP & Reverse Proxy (Caddy handles TLS/HTTPS and forwards X-Forwarded-* headers)
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
proxy_mode = True

; Database & Security
; Leave admin_passwd blank here; inject real secret via ODOO_ADMIN_PASSWD in deploy/env/prod.env
admin_passwd =
list_db = False
dbfilter = ^odoo_prod$
db_maxconn = 64
without_demo = True

; Multiprocessing (Sized for 4 cores / 8 threads shared host)
workers = 4
gevent_workers = 1
max_cron_threads = 2
limit_memory_soft = 1610612736
limit_memory_hard = 2147483648
limit_time_cpu = 600
limit_time_real = 1200

; Logging
log_level = info
log_handler = :INFO,werkzeug:WARNING

