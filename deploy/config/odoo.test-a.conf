[options]
; Test A / Team Testing (สำหรับทีม Dev/QA ทดสอบระบบและทดลองฟีเจอร์ใหม่)
addons_path = /opt/odoo/odoo/addons,/opt/odoo/addons,/opt/odoo/custom_addons
data_dir = /var/lib/odoo

; HTTP & Reverse Proxy
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
proxy_mode = True

; Database & Security
; Inject real secret via ODOO_ADMIN_PASSWD in deploy/env/test-a.env
admin_passwd =
list_db = True
dbfilter = ^odoo_test_a
db_maxconn = 32

; Threaded mode (Low memory footprint, websocket runs on 8069)
workers = 0
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200

; Safe Outbound Email Fallback (captures test emails into Mailpit container)
smtp_server = mailpit
smtp_port = 1025
smtp_ssl = False

; Logging
log_level = info

